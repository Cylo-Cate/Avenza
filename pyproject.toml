[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "avenza"
version = "0.1.0"
description = "Wallpaper animado para Windows (WorkerW), controlado por CLI e bandeja"
requires-python = ">=3.9"
dependencies = ["PyQt6"]

[project.scripts]
avenza = "avenza:main"

[tool.setuptools]
py-modules = ["avenza"]
